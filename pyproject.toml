[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".vscode",
    "mcrit_plugin/core/minimcrit",
    "mcrit_plugin/core/pylev",
    "icons",
    "docs/qt-designer-mockup",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
