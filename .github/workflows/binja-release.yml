# extensions.binary.ninja reads plugin.json at the commit of the latest GitHub release and only
# looks at its "version" field; tag names and release titles are never parsed.
#
# The version is raised in plugin.json through a pull request, like the IDA plugin's. This workflow
# then tags the commit on the default branch and publishes it as the latest release; it never pushes
# to the branch, so the ruleset that requires pull requests needs no bypass.
name: Binary Ninja release

on:
  workflow_dispatch:
    inputs:
      description:
        description: "Release notes shown in the extension manager (leave blank to generate them)"
        required: false
        default: ""
        type: string
      dry-run:
        description: "Validate only: report the version that would be released without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: binja-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    timeout-minutes: 15
    # the release is always cut from the default branch, whichever ref the workflow was started from
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # the version check below needs every tag
          fetch-depth: 0
          persist-credentials: false

      - name: Record the verified commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: python scripts/common/verify_release_ci.py --repo "$REPO" --sha "$SHA" --plugin binja

      # extensions.binary.ninja silently skips a version it has already seen, so the version must be
      # new: no tag may name it yet, and it must be greater than that of the current latest release.
      - name: Check the version in plugin.json is new
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          version=$(python -c 'import json; print(json.load(open("plugin.json"))["version"])')
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::plugin.json version '${version}' is not X.Y.Z."
            exit 1
          fi
          for tag in "${version}" "v${version}"; do
            if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              echo "::error::Tag ${tag} already names ${version}. Raise the version in plugin.json through a pull request."
              exit 1
            fi
          done
          previous=$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name' 2> /dev/null || true)
          previous_version="${previous#v}"
          if [ -n "${previous_version}" ] && \
             [ "$(printf '%s\n%s\n' "${previous_version}" "${version}" | sort -V | tail -n1)" != "${version}" ]; then
            echo "::error::plugin.json version ${version} is not greater than the latest release ${previous}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${previous:-nothing} -> ${version}"

  build:
    name: Validate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests ruff PySide6

      - name: Verify metadata sync
        run: python scripts/binja/verify_metadata_sync.py --repo .

      - name: Verify settings sync
        run: python scripts/common/verify_settings_sync.py --repo .

      - name: Run quality checks
        run: python scripts/common/run_quality_checks.py --repo .

      - name: Run unit tests
        run: python -m pytest tests

  release:
    name: Publish release
    timeout-minutes: 10
    needs: [verify, build, offline-dependencies]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.build.result == 'success' && (inputs.dry-run || needs.offline-dependencies.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Download dependency bundles
        if: ${{ !inputs.dry-run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcrit-plugin-dependencies-*
          path: dist
          merge-multiple: true

      - name: Refuse to release an unverified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          head=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq '.sha')
          if [ "${head}" != "${VERIFIED_SHA}" ]; then
            echo "::error::The default branch moved after verification; run the release again."
            exit 1
          fi

      # The release API creates the tag on the verified commit; nothing is pushed to the branch.
      # --generate-notes appends its list under the notes, counted from the previous latest release.
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.verify.outputs.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          PREVIOUS: ${{ needs.verify.outputs.previous }}
          DESCRIPTION: ${{ inputs.description }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          flags=(--repo "${REPO}" --target "${SHA}" --title "${VERSION}" --generate-notes)
          if [ -n "${PREVIOUS}" ]; then
            flags+=(--notes-start-tag "${PREVIOUS}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            {
              echo "### Dry run: nothing was tagged or published"
              echo "A real run would have released \`${PREVIOUS:-nothing}\` -> \`${VERSION}\` from \`${SHA}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shopt -s failglob
          gh release create "${VERSION}" dist/* --draft "${flags[@]}" --notes "${DESCRIPTION}"
          gh release edit "$VERSION" --repo "$REPO" --draft=false --latest
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

  offline-dependencies:
    name: Build offline dependency bundles
    needs: verify
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
    uses: ./.github/workflows/offline-dependencies.yml
    with:
      tag: ${{ needs.verify.outputs.version }}
      ref: ${{ needs.verify.outputs.sha }}
      upload-to-release: false
      variants: '[{"name": "binja", "packages": "-r requirements.txt"}]'
      # smda 4.9.0, which requirements.txt asks for, needs Python 3.11 or newer
      pythons: '["3.11", "3.12", "3.13"]'
