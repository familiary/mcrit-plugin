name: IDA release

on:
  push:
    tags:
      - "ida-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      version: ${{ steps.guard.outputs.version }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check the tag against the declared version and the changelog
        id: guard
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python .github/workflows/scripts/ida/release_guard.py \
            --tag "${TAG}" --notes release-notes.md --github-output "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check the tag is on the default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          status=$(gh api "repos/${REPO}/compare/${BRANCH}...${TAG}" --jq .status)
          # "identical"/"behind" mean the tag is reachable from main
          if [ "${status}" != "identical" ] && [ "${status}" != "behind" ]; then
            echo "::error::${TAG} is not an ancestor of main; releases are cut from main."
            exit 1
          fi

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.guard.outputs.sha }}
        run: python scripts/common/verify_release_ci.py --repo "$REPO" --sha "$SHA" --plugin ida

      - name: Keep the release notes for the later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Validate and build plugin archive
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release tooling
        run: python -m pip install --upgrade pip "ida-hcli==0.28.0" ruff pytest requests PySide6

      - name: Verify HCLI runtime imports
        run: python -c "import hcli.main"

      - name: Verify metadata sync
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python scripts/ida/verify_metadata_sync.py --repo . --expected-version "${VERSION}"

      - name: Verify settings sync
        run: python scripts/common/verify_settings_sync.py --repo .

      - name: Run quality checks
        run: python scripts/common/run_quality_checks.py --repo .

      - name: Run unit tests
        run: python -m pytest tests

      - name: Build plugin archive
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python scripts/ida/package_plugin.py --repo . --output "dist/mcrit-ida-${VERSION}.zip"

      - name: Lint HCLI package metadata
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          hcli plugin lint "dist/mcrit-ida-${VERSION}.zip"

      - name: Keep the artifacts for the later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [verify, build, offline-dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist

      - name: Download dependency bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcrit-plugin-dependencies-*
          path: dist
          merge-multiple: true

      - name: Fetch the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # --generate-notes appends its list under --notes-file rather than replacing it. An IDA release is
      # never "latest": extensions.binary.ninja reads plugin.json from the latest release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          shopt -s failglob
          flags=()
          if [ "${PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi
          # Refuse a moved tag before publishing the already verified artifacts.
          tagged_sha=$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)
          if [[ "$tagged_sha" != "$SHA" ]]; then
            echo "::error::The release tag moved after verification."
            exit 1
          fi
          gh release create "${TAG}" dist/* --draft \
            --repo "${REPO}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest=false

  offline-dependencies:
    name: Build offline dependency bundles
    needs: verify
    permissions:
      contents: write
    uses: ./.github/workflows/offline-dependencies.yml
    with:
      tag: ${{ github.ref_name }}
      ref: ${{ needs.verify.outputs.sha }}
      upload-to-release: false
      variants: '[{"name": "smda", "packages": "smda"}, {"name": "full", "packages": "smda ida-settings"}]'
