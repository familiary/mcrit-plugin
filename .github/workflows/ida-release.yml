name: IDA release

on:
  push:
    tags:
      - "ida-v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check the tag against the declared version and the changelog
        id: guard
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python .github/workflows/scripts/ida/release_guard.py \
            --tag "${TAG}" --notes release-notes.md --github-output "${GITHUB_OUTPUT}"

      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          status=$(gh api "repos/${REPO}/compare/main...${TAG}" --jq .status)
          # "identical"/"behind" mean the tag is reachable from main
          if [ "${status}" != "identical" ] && [ "${status}" != "behind" ]; then
            echo "::error::${TAG} is not an ancestor of main; releases are cut from main."
            exit 1
          fi

      - name: Check CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: main
        run: |
          conclusion=$(gh api \
            "repos/${REPO}/actions/workflows/pytest.yml/runs?head_sha=${SHA}&status=completed&event=push&branch=${BRANCH}" \
            --jq '.workflow_runs[0].conclusion // ""')
          if [ -z "${conclusion}" ]; then
            echo "::error::No completed CI run for ${SHA}. Wait for main to go green, then re-run."
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI concluded '${conclusion}' for ${SHA}. Fix main before releasing."
            exit 1
          fi
          echo "CI passed on ${SHA}"

      - name: Keep the release notes for the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Validate and build the plugin archive
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release tooling
        run: python -m pip install --upgrade pip ida-hcli ruff

      - name: Verify HCLI runtime imports
        run: python -c "import hcli.main"

      - name: Verify metadata sync
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python scripts/ida/verify_metadata_sync.py --repo . --expected-version "${VERSION}"

      - name: Verify settings sync
        run: python scripts/common/verify_settings_sync.py --repo .

      - name: Run quality checks
        run: python scripts/common/run_quality_checks.py --repo .

      - name: Build plugin archive
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python scripts/ida/package_plugin.py --repo . --output "dist/mcrit-ida-${VERSION}.zip"

      - name: Lint HCLI package metadata
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          hcli plugin lint "dist/mcrit-ida-${VERSION}.zip"

      - name: Keep the artifacts for the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: dist

      - name: Fetch the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # --generate-notes appends its list under --notes-file rather than replacing it. An IDA release is
      # never "latest": extensions.binary.ninja reads plugin.json from the latest release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          shopt -s failglob
          flags=(--latest=false)
          if [ "${PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" dist/* \
            --repo "${REPO}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"

  offline-dependencies:
    name: Attach offline dependency bundles
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/offline-dependencies.yml
    with:
      tag: ${{ github.ref_name }}
      variants: '[{"name": "smda", "packages": "smda"}, {"name": "full", "packages": "smda ida-settings"}]'
