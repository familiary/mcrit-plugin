name: IDA CI

on:
  push:
    branches:
      - main
    paths: &paths
      - "mcrit_plugin/ida/**"
      - "scripts/ida/**"
      - "tests/ida/**"
      - "CHANGELOG.md"
      - "docs/config_override.json.template"
      - ".github/workflows/ida-*.yml"
      - ".github/workflows/scripts/ida/**"
      - "mcrit_plugin/core/**"
      - "mcrit_plugin/__init__.py"
      - "mcrit_plugin/ui_qt/**"
      - "icons/**"
      - "scripts/common/**"
      - "tests/core/**"
      - "tests/ui_qt/**"
      - "tests/conftest.py"
      - "tests/fixtures/**"
      - "README.md"
      - "LICENSE"
      - "pyproject.toml"
      - ".gitattributes"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SMDA_VERSION: "4.10.0"
  HCLI_VERSION: "0.28.0"
  MCRIT_VERSION: "1.12.0"
  MCRIT_SERVER: "http://127.0.0.1:8000"

jobs:
  preflight:
    name: Check license availability
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Check configuration
        id: decide
        env:
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          HAS_SECRETS: ${{ secrets.IDA_LICENSE_ID != '' && secrets.HCLI_API_KEY != '' }}
        run: |
          reason=""
          if [[ "$FORK_PR" == "true" ]]; then
            reason="the pull request comes from a fork, which does not receive the IDA licence secrets"
          elif [[ "$HAS_SECRETS" != "true" ]]; then
            reason="IDA_LICENSE_ID or HCLI_API_KEY is not set on this repository"
          fi
          if [[ -z "$reason" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::warning::Licensed IDA integration will not run: $reason"
          fi

  licensed-linux:
    name: IDA ${{ matrix.version }} / Linux / headless and GUI
    strategy:
      fail-fast: false
      matrix:
        version: ["9.0", "9.1", "9.2", "9.3", "9.4", "9.5"]
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mongo:
        image: mongo:5.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install HCLI
        run: uv tool install "ida-hcli==${HCLI_VERSION}"

      # Metadata, settings and lint checks run in the Validate and IDA package workflows.
      - name: Build plugin archive
        run: python scripts/ida/package_plugin.py --repo . --output dist/mcrit-ida.zip

      - name: Install GUI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libopengl0 libgl1 libegl1 libxkbcommon0 libdbus-1-3 fontconfig \
            libx11-6 libxcb1 libxcb-cursor0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-icccm4 libxcb-image0 libxcb-xkb1 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxcb-sync1 libfreetype6 xvfb

      - name: Install disassembler
        id: ida
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
          IDA_VERSION: ${{ matrix.version }}
        run: |
          IDA_DIR="$RUNNER_TEMP/opt/ida"
          hcli ida install -y \
            -d "ida-pro:${IDA_VERSION}:x64linux" \
            -l "$IDA_LICENSE_ID" \
            -i "$IDA_DIR"
          test -x "$IDA_DIR/ida"
          echo "ida-dir=$IDA_DIR" >> "$GITHUB_OUTPUT"
          # hcli --accept-eula records EULA acceptance only in the *default* IDAUSR; the isolated
          # test profiles refuse batch mode without the accepted ida.reg.
          SRC=""
          for cand in "$IDA_DIR/ida.reg" "$HOME/.idapro/ida.reg"; do
            if [[ -f "$cand" ]]; then SRC="$cand"; break; fi
          done
          if [[ -z "$SRC" ]]; then
            echo "::warning::No accepted ida.reg found to propagate into test profiles"
          else
            for prof in "$RUNNER_TEMP/idausr-idalib" "$RUNNER_TEMP/idausr-gui"; do
              mkdir -p "$prof"
              cp "$SRC" "$prof/ida.reg"
            done
            echo "Propagated IDA acceptance from $SRC into test profiles"
          fi

      - name: Install MCRIT service
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/mcrit-venv"
          uv pip install --python "$RUNNER_TEMP/mcrit-venv/bin/python" "mcrit==${MCRIT_VERSION}"

      - name: Install IDALib test runtime
        run: |
          # --seed: install_idalib_runtime.py installs IDA's bundled bindings with pip
          uv venv --seed --python 3.12 "$RUNNER_TEMP/idalib-venv"
          IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/bin/python"
          echo "IDALIB_PYTHON=$IDALIB_PYTHON" >> "$GITHUB_ENV"
          "$IDALIB_PYTHON" scripts/ida/install_idalib_runtime.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}"
          uv pip install --python "$IDALIB_PYTHON" \
            "smda==${SMDA_VERSION}" "ida-settings==3.5.1" "requests"

      - name: Install plugin dependencies
        env:
          IDA_VERSION: ${{ matrix.version }}
        run: |
          # The Linux installer has no bundled Python executable.
          uv pip install --target "$RUNNER_TEMP/ida-py-deps" \
            "requests" "smda==${SMDA_VERSION}" "ida-settings==3.5.1"
          # IDA 9.0/9.1 use Qt 5; later installers supply their own PySide6 bindings.
          if [[ "$IDA_VERSION" == "9.0" || "$IDA_VERSION" == "9.1" ]]; then
            uv pip install --target "$RUNNER_TEMP/ida-py-deps" "PyQt5==5.15.11"
          fi

      - name: Build deterministic MCRIT fixtures
        run: |
          python scripts/common/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-reference.exe" \
            --variant 0
          python scripts/common/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-idalib-query.exe" \
            --variant 1
          python scripts/common/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-gui-query.exe" \
            --variant 2

      - name: Start MCRIT server and worker
        run: |
          # setsid, not nohup alone: the runner SIGTERMs the step's process group when this step's
          # shell exits, which would kill the services before the "Wait for MCRIT API" step
          setsid nohup "$RUNNER_TEMP/mcrit-venv/bin/python" -m mcrit server \
            > "$RUNNER_TEMP/mcrit-server.log" 2>&1 < /dev/null &
          setsid nohup "$RUNNER_TEMP/mcrit-venv/bin/python" -m mcrit worker \
            > "$RUNNER_TEMP/mcrit-worker.log" 2>&1 < /dev/null &

      - name: Wait for MCRIT API
        run: |
          "$RUNNER_TEMP/mcrit-venv/bin/python" - <<'PY'
          import time
          import requests

          deadline = time.monotonic() + 90
          last_error = None
          while time.monotonic() < deadline:
              try:
                  response = requests.get("http://127.0.0.1:8000/version", timeout=2)
                  if response.ok:
                      print(response.text)
                      break
              except Exception as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise SystemExit(f"MCRIT API did not become ready: {last_error}")
          PY

      - name: Seed MCRIT reference sample
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/mcrit-venv/bin/python" scripts/common/seed_mcrit.py \
            --server "$MCRIT_SERVER" \
            --sample "${{ runner.temp }}/mcrit-reference.exe" \
            --timeout 180

      - name: Record reference SHA-256
        id: reference
        run: echo "sha256=$(sha256sum '${{ runner.temp }}/mcrit-reference.exe' | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run headless integration tests
        run: |
          "$IDALIB_PYTHON" scripts/ida/run_idalib_integration.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/mcrit-idalib-query.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --reference-sha256 "${{ steps.reference.outputs.sha256 }}" \
            --idausr "$RUNNER_TEMP/idausr-idalib" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/idalib-artifacts" \
            --log "$RUNNER_TEMP/idalib-integration.log" \
            --timeout 180 \
            --require-hcli

      - name: Seed GUI profile from licensed IDALib profile
        run: |
          SOURCE_REG="$RUNNER_TEMP/idausr-idalib/ida.reg"
          GUI_REG="$RUNNER_TEMP/idausr-gui/ida.reg"
          test -f "$SOURCE_REG"
          cp "$SOURCE_REG" "$GUI_REG"
          strings "$GUI_REG" | grep -q '^Licenses$'

      - name: Pre-accept IDAPython PyQt5 shim for GUI profile
        run: |
          # IDA 9.2+ shows a modal "enable the PyQt5 shim?" dialog on the first PyQt5 import; it ignores
          # -A / batch mode and blocks startup forever. IDAPYTHON_USE_PYQT5_SHIM=0 silences it.
          mkdir -p "$RUNNER_TEMP/idausr-gui/cfg"
          cat > "$RUNNER_TEMP/idausr-gui/cfg/idapython.cfg" <<'CFG'
          #if __IDAVER__ >= 920
          IDAPYTHON_USE_PYQT5_SHIM = 0
          #endif
          CFG

      - name: Configure IDAPython for GUI integration test
        env:
          IDAUSR: ${{ runner.temp }}/idausr-gui
        run: |
          IDAPYSWITCH=$(find "${{ steps.ida.outputs.ida-dir }}" -type f -name 'idapyswitch*' -perm -u+x -print -quit)
          test -n "$IDAPYSWITCH"
          # Ask Python for its own shared library rather than globbing LIBDIR. That
          # directory holds libpython3.11.so.1.0, libpython3.11.so and libpython3.so,
          # and `find -print -quit` returns whichever comes first in directory order.
          # libpython3.so is the stable-ABI forwarder and carries no version, so
          # idapyswitch rejects it with "Unsupported python version 0.0.0 ('')".
          PYTHON_LIBRARY="$(python - <<'PY'
          import sysconfig
          from pathlib import Path

          libdir = Path(sysconfig.get_config_var("LIBDIR") or "")
          # INSTSONAME is the versioned soname, LDLIBRARY the unversioned link name.
          # PY3LIBRARY (libpython3.so) is deliberately not a candidate.
          for var in ("INSTSONAME", "LDLIBRARY"):
              name = sysconfig.get_config_var(var)
              if not name or ".so" not in name:
                  continue
              candidate = libdir / name
              if candidate.is_file():
                  print(candidate)
                  break
          else:
              raise SystemExit(f"no shared libpython found in {libdir}")
          PY
          )"
          test -f "$PYTHON_LIBRARY"
          echo "Using $PYTHON_LIBRARY"
          "$IDAPYSWITCH" --force-path "$PYTHON_LIBRARY"

      - name: Run GUI integration tests
        env:
          PYTHONPATH: ${{ runner.temp }}/ida-py-deps
          IDALOG: ${{ runner.temp }}/ida-gui-startup.log
          IDA_VERSION: ${{ matrix.version }}
        run: |
          # keep the keyfile outside the isolated IDAUSR: that profile is uploaded as a CI artifact
          LICENSE_FILE=$(find "${{ steps.ida.outputs.ida-dir }}" -maxdepth 1 -type f -name '*.hexlic' -print -quit)
          test -n "$LICENSE_FILE"
          # IDA 9.0 rejects the ":setpref" suffix as part of the file name
          if [[ "$IDA_VERSION" == "9.0" ]]; then
            export IDA_LICENSE="keyfile=${LICENSE_FILE}"
          else
            export IDA_LICENSE="keyfile=${LICENSE_FILE}:setpref"
          fi
          xvfb-run -a python scripts/ida/run_gui_integration.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/mcrit-gui-query.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --reference-sha256 "${{ steps.reference.outputs.sha256 }}" \
            --idausr "$RUNNER_TEMP/idausr-gui" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/ida-gui-artifacts" \
            --log "$RUNNER_TEMP/ida-gui-integration.log" \
            --timeout 180 \
            --qt-platform xcb \
            --require-hcli

      - name: Upload integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ida-${{ matrix.version }}-linux-logs
          retention-days: 14
          path: |
            ${{ runner.temp }}/idalib-integration.log
            ${{ runner.temp }}/ida-gui-integration.log
            ${{ runner.temp }}/ida-gui-startup.log
            ${{ runner.temp }}/mcrit-server.log
            ${{ runner.temp }}/mcrit-worker.log
            ${{ runner.temp }}/idalib-artifacts
            ${{ runner.temp }}/ida-gui-artifacts
          if-no-files-found: warn

  licensed-result:
    name: Integration result
    timeout-minutes: 5
    needs: [preflight, licensed-linux, other-platforms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Missing secrets are reported explicitly; real matrix failures must fail this check.
      - name: Report integration result
        env:
          RESULT: ${{ needs.licensed-linux.result }}
          REASON: ${{ needs.preflight.outputs.reason }}
          PREFLIGHT: ${{ needs.preflight.result }}
          OTHER_PLATFORMS: ${{ needs.other-platforms.result }}
        run: |
          if [[ "$PREFLIGHT" != "success" || "$RESULT" == "failure" || "$RESULT" == "cancelled" || "$OTHER_PLATFORMS" == "failure" || "$OTHER_PLATFORMS" == "cancelled" ]]; then
            echo "::error::IDA integration failed (preflight=$PREFLIGHT, linux=$RESULT, other platforms=$OTHER_PLATFORMS)"
            exit 1
          fi
          if [[ "$RESULT" == "success" ]]; then
            echo "All IDA 9.0–9.5 live integration tests passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$RESULT" == "skipped" ]]; then
            message="The licensed IDA integration did not run: $REASON. Dispatch this workflow on a branch of this repository before merging."
          else
            message="The licensed IDA integration ended with result '$RESULT'."
          fi
          echo "::warning::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  # Pull requests get the Linux matrix only; pushes to main and manual runs add these.
  other-platforms:
    # A skipped job shows its name unexpanded, so the name leaves the matrix to GitHub's suffix
    name: IDA 9.5 / offline headless
    needs: preflight
    if: ${{ needs.preflight.outputs.run == 'true' && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      IDA_VERSION: "9.5"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install HCLI
        run: uv tool install "ida-hcli==${HCLI_VERSION}"

      - name: Build plugin archive
        run: python scripts/ida/package_plugin.py --repo . --output dist/mcrit-ida.zip

      - name: Install disassembler
        id: ida
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            installer="x64win"
          else
            installer="armmac"
          fi
          IDA_DIR="$RUNNER_TEMP/opt/ida"
          hcli ida install -y \
            -d "ida-pro:${IDA_VERSION}:${installer}" \
            -l "$IDA_LICENSE_ID" \
            -i "$IDA_DIR"
          test -d "$IDA_DIR"
          echo "ida-dir=$IDA_DIR" >> "$GITHUB_OUTPUT"
          # macOS keeps the accepted EULA in ida.reg, which the isolated profile needs a copy of;
          # Windows keeps it in the registry.
          if [[ -f "$HOME/.idapro/ida.reg" ]]; then
            mkdir -p "$RUNNER_TEMP/idausr-idalib"
            cp "$HOME/.idapro/ida.reg" "$RUNNER_TEMP/idausr-idalib/ida.reg"
          fi

      - name: Build fixture
        run: |
          python scripts/common/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/ida-fixture.exe" \
            --variant 0

      - name: Install IDALib test runtime
        run: |
          # --seed: install_idalib_runtime.py installs IDA's bundled bindings with pip
          uv venv --seed --python 3.12 "$RUNNER_TEMP/idalib-venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/Scripts/python.exe"
          else
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/bin/python"
          fi
          echo "IDALIB_PYTHON=$IDALIB_PYTHON" >> "$GITHUB_ENV"
          "$IDALIB_PYTHON" scripts/ida/install_idalib_runtime.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}"
          uv pip install --python "$IDALIB_PYTHON" \
            "smda==${SMDA_VERSION}" "ida-settings==3.5.1" "requests"

      - name: Run offline headless integration test
        run: |
          "$IDALIB_PYTHON" scripts/ida/run_idalib_integration.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/ida-fixture.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --idausr "$RUNNER_TEMP/idausr-idalib" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/idalib-artifacts" \
            --log "$RUNNER_TEMP/idalib-integration.log" \
            --offline \
            --require-hcli

      - name: Upload integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ida-9.5-${{ matrix.os }}-logs
          retention-days: 14
          path: |
            ${{ runner.temp }}/idalib-integration.log
            ${{ runner.temp }}/idalib-artifacts
          if-no-files-found: warn
