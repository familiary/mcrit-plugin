name: IDA integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_matrix:
        description: Run the broader IDA version and operating-system matrix
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ida-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  MCRIT_VERSION: "1.5.2"
  MCRIT_SERVER: "http://127.0.0.1:8000"

jobs:
  licensed-linux:
    name: IDA Pro 9.3 / Ubuntu / live MCRIT
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:5.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install Linux IDA runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libopengl0 libgl1 libegl1 libxkbcommon0 libdbus-1-3 fontconfig \
            libx11-6 libxcb1 libxcb-cursor0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-icccm4 libxcb-image0 libxcb-xkb1 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxcb-sync1 libfreetype6 xvfb

      - name: Install IDA Pro 9.3
        id: ida
        shell: bash
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
        run: |
          IDA_DIR="$RUNNER_TEMP/opt/ida"
          uv tool install ida-hcli
          hcli ida install -y \
            --accept-eula \
            --set-default \
            -d release/9.3/ida-pro/ida-pro_93_x64linux.run \
            -l "$IDA_LICENSE_ID" \
            -i "$IDA_DIR"
          test -d "$IDA_DIR"
          test -x "$IDA_DIR/ida"
          echo "ida-dir=$IDA_DIR" >> "$GITHUB_OUTPUT"
          echo "ida-bin=$IDA_DIR/ida" >> "$GITHUB_OUTPUT"
          # hcli --accept-eula records EULA acceptance in the *default* IDAUSR,
          # but the smoke tests use isolated profiles which would otherwise
          # refuse batch mode.
          # Propagate the accepted ida.reg into those profiles.
          SRC=""
          for cand in "$IDA_DIR/ida.reg" "$HOME/.idapro/ida.reg"; do
            if [[ -f "$cand" ]]; then SRC="$cand"; break; fi
          done
          if [[ -z "$SRC" ]]; then
            echo "::warning::No accepted ida.reg found to propagate into smoke profiles"
          else
            for prof in "$RUNNER_TEMP/idausr-idalib" "$RUNNER_TEMP/idausr-gui"; do
              mkdir -p "$prof"
              cp "$SRC" "$prof/ida.reg"
            done
            echo "Propagated IDA acceptance from $SRC into smoke profiles"
          fi

      - name: Keep HCLI on PATH
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify service Python
        shell: bash
        run: |
          python --version
          python - <<'PY'
          import os
          import sys

          if sys.version_info[:2] != (3, 11):
              raise SystemExit(
                  f"MCRIT {os.environ['MCRIT_VERSION']} requires Python 3.11, got {sys.version}"
              )
          PY

      - name: Verify headless IDA executable
        shell: bash
        run: |
          IDA_HEADLESS=""
          for name in idat64 idat idat64.exe idat.exe; do
            candidate="$(find "${{ steps.ida.outputs.ida-dir }}" -type f -name "$name" -print -quit)"
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              IDA_HEADLESS="$candidate"
              break
            fi
          done
          if [[ -z "$IDA_HEADLESS" ]]; then
            echo "::error::Could not locate a headless IDA executable (idat64/idat) under ${{ steps.ida.outputs.ida-dir }}"
            exit 1
          fi
          echo "Found headless IDA executable: $IDA_HEADLESS"
          # Probe the binary to capture diagnostic help output. This must not fail
          # the build: a freshly installed IDA may not have its license accepted
          # yet (which the later smoke test tolerates) and some IDA versions/
          # platforms return a non-zero exit from `-h` regardless.
          "$IDA_HEADLESS" -h > "$RUNNER_TEMP/ida-headless-help.txt" 2>&1 || true

      - name: Install validation tooling
        run: python -m pip install --upgrade pip ruff

      - name: Verify metadata and package
        shell: bash
        run: |
          python scripts/verify_metadata_sync.py --repo .
          python scripts/verify_settings_sync.py --repo .
          python scripts/run_quality_checks.py --repo .
          python scripts/package_plugin.py --repo . --output dist/mcrit-ida.zip
          hcli plugin lint .
          hcli plugin lint dist/mcrit-ida.zip

      - name: Build deterministic MCRIT fixtures
        run: |
          python scripts/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-reference.exe" \
            --variant 0
          python scripts/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-idalib-query.exe" \
            --variant 1
          python scripts/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-gui-query.exe" \
            --variant 2

      - name: Install MCRIT service
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/mcrit-venv"
          "$RUNNER_TEMP/mcrit-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/mcrit-venv/bin/python" -m pip install "mcrit==${MCRIT_VERSION}"

      - name: Install IDALib test runtime
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/idalib-venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/Scripts/python.exe"
          else
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/bin/python"
          fi
          echo "IDALIB_PYTHON=$IDALIB_PYTHON" >> "$GITHUB_ENV"
          "$IDALIB_PYTHON" -m pip install --upgrade pip
          "$IDALIB_PYTHON" -m pip install --upgrade \
            "${{ steps.ida.outputs.ida-dir }}/idalib/python"/idapro-*.whl \
            "smda==4.3.10" "ida-settings==3.5.1" "PySide6" "requests"

      - name: Wait for MongoDB
        shell: bash
        run: |
          "$RUNNER_TEMP/mcrit-venv/bin/python" - <<'PY'
          import time
          import pymongo

          deadline = time.monotonic() + 60
          last_error = None
          while time.monotonic() < deadline:
              try:
                  client = pymongo.MongoClient(
                      "mongodb://127.0.0.1:27017/",
                      serverSelectionTimeoutMS=1000,
                  )
                  client.admin.command("ping")
                  print("MongoDB is ready.")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"MongoDB did not become ready: {last_error}")
          PY

      - name: Start MCRIT server and worker
        shell: bash
        run: |
          # setsid fully detaches the services into their own session so GitHub
          # Actions does not terminate them when this step's shell exits (nohup
          # alone only ignores SIGHUP, not the SIGTERM the runner sends to the
          # step's process group). Without this, the server/worker are killed
          # before the "Wait for MCRIT API" step runs, which then hangs until
          # its timeout.
          setsid nohup "$RUNNER_TEMP/mcrit-venv/bin/python" -m mcrit server \
            > "$RUNNER_TEMP/mcrit-server.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/mcrit-server.pid"
          setsid nohup "$RUNNER_TEMP/mcrit-venv/bin/python" -m mcrit worker \
            > "$RUNNER_TEMP/mcrit-worker.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/mcrit-worker.pid"
          # Fail fast (with startup logs) if either process crashed immediately,
          # instead of hanging for the full API-wait timeout.
          sleep 5
          if ! kill -0 "$(cat "$RUNNER_TEMP/mcrit-server.pid")" 2>/dev/null; then
            echo "::error::MCRIT server exited during startup:"
            cat "$RUNNER_TEMP/mcrit-server.log"
            exit 1
          fi
          if ! kill -0 "$(cat "$RUNNER_TEMP/mcrit-worker.pid")" 2>/dev/null; then
            echo "::error::MCRIT worker exited during startup:"
            cat "$RUNNER_TEMP/mcrit-worker.log"
            exit 1
          fi
          echo "MCRIT server (pid $(cat "$RUNNER_TEMP/mcrit-server.pid")) and worker (pid $(cat "$RUNNER_TEMP/mcrit-worker.pid")) started."

      - name: Wait for MCRIT API
        shell: bash
        run: |
          "$RUNNER_TEMP/mcrit-venv/bin/python" - <<'PY'
          import time
          import requests

          deadline = time.monotonic() + 90
          last_error = None
          while time.monotonic() < deadline:
              try:
                  response = requests.get("http://127.0.0.1:8000/version", timeout=2)
                  if response.ok:
                      print(response.text)
                      break
              except Exception as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise SystemExit(f"MCRIT API did not become ready: {last_error}")
          PY

      - name: Seed MCRIT reference sample
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/mcrit-venv/bin/python" scripts/seed_mcrit.py \
            --server "$MCRIT_SERVER" \
            --sample "${{ runner.temp }}/mcrit-reference.exe" \
            --timeout 180

      - name: Record reference SHA-256
        id: reference
        shell: bash
        run: echo "sha256=$(sha256sum '${{ runner.temp }}/mcrit-reference.exe' | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run live IDALib integration smoke test
        shell: bash
        run: |
          "$IDALIB_PYTHON" scripts/run_idalib_smoke.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/mcrit-idalib-query.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --reference-sha256 "${{ steps.reference.outputs.sha256 }}" \
            --idausr "$RUNNER_TEMP/idausr-idalib" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/idalib-artifacts" \
            --log "$RUNNER_TEMP/idalib-smoke.log" \
            --timeout 180 \
            --require-hcli

      - name: Install plugin runtime deps for IDA's Python
        shell: bash
        run: |
          # The Linux installer has no bundled Python executable. Keep the plugin
          # dependencies isolated and make them visible to the configured IDAPython.
          python -m pip install --target "$RUNNER_TEMP/ida-py-deps" \
            "requests" "smda==4.3.10" "ida-settings==3.5.1"

      - name: Seed GUI profile from licensed IDALib profile
        shell: bash
        run: |
          SOURCE_REG="$RUNNER_TEMP/idausr-idalib/ida.reg"
          GUI_REG="$RUNNER_TEMP/idausr-gui/ida.reg"
          test -f "$SOURCE_REG"
          cp "$SOURCE_REG" "$GUI_REG"
          strings "$GUI_REG" | grep -q '^Licenses$'

      - name: Pre-accept IDAPython PyQt5 shim for GUI profile
        shell: bash
        run: |
          # IDA 9.2+ shows a modal "do you want to enable the PyQt5 shim?" dialog
          # the first time anything in the process imports PyQt5. The mcrit plugin
          # imports PyQt5 unconditionally (helpers/QtShim.py, helpers/pyperclip),
          # and the dialog ignores -A / batch mode, blocking startup forever.
          # IDAPYTHON_USE_PYQT5_SHIM=0 in the GUI profile's idapython.cfg silences
          # the prompt. Guarded on __IDAVER__ >= 920 so older IDA versions ignore it.
          mkdir -p "$RUNNER_TEMP/idausr-gui/cfg"
          cat > "$RUNNER_TEMP/idausr-gui/cfg/idapython.cfg" <<'CFG'
          #if __IDAVER__ >= 920
          IDAPYTHON_USE_PYQT5_SHIM = 0
          #endif
          CFG

      - name: Configure IDAPython for GUI smoke
        shell: bash
        env:
          IDAUSR: ${{ runner.temp }}/idausr-gui
        run: |
          IDAPYSWITCH=$(find "${{ steps.ida.outputs.ida-dir }}" -type f -name 'idapyswitch*' -perm -u+x -print -quit)
          test -n "$IDAPYSWITCH"
          # Ask Python for its own shared library rather than globbing LIBDIR. That
          # directory holds libpython3.11.so.1.0, libpython3.11.so and libpython3.so,
          # and `find -print -quit` returns whichever comes first in directory order.
          # libpython3.so is the stable-ABI forwarder and carries no version, so
          # idapyswitch rejects it with "Unsupported python version 0.0.0 ('')".
          PYTHON_LIBRARY="$(python - <<'PY'
          import sysconfig
          from pathlib import Path

          libdir = Path(sysconfig.get_config_var("LIBDIR") or "")
          # INSTSONAME is the versioned soname, LDLIBRARY the unversioned link name.
          # PY3LIBRARY (libpython3.so) is deliberately not a candidate.
          for var in ("INSTSONAME", "LDLIBRARY"):
              name = sysconfig.get_config_var(var)
              if not name or ".so" not in name:
                  continue
              candidate = libdir / name
              if candidate.is_file():
                  print(candidate)
                  break
          else:
              raise SystemExit(f"no shared libpython found in {libdir}")
          PY
          )"
          test -f "$PYTHON_LIBRARY"
          echo "Using $PYTHON_LIBRARY"
          "$IDAPYSWITCH" --force-path "$PYTHON_LIBRARY"

      - name: Run licensed IDA GUI toolbar smoke test
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/ida-py-deps
          IDALOG: ${{ runner.temp }}/ida-gui-startup.log
        run: |
          # The GUI smoke test launches the actual IDA GUI binary, which needs a
          # usable display. Provide a virtual X display via xvfb-run and let Qt use
          # the xcb platform against it.
          # The GUI run uses an isolated IDAUSR. Keep the keyfile outside that
          # directory, because the profile is uploaded as a CI artifact.
          LICENSE_FILE=$(find "${{ steps.ida.outputs.ida-dir }}" -maxdepth 1 -type f -name '*.hexlic' -print -quit)
          test -n "$LICENSE_FILE"
          export IDA_LICENSE="keyfile=${LICENSE_FILE}:setpref"
          xvfb-run -a python scripts/run_ida_smoke.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/mcrit-gui-query.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --reference-sha256 "${{ steps.reference.outputs.sha256 }}" \
            --idausr "$RUNNER_TEMP/idausr-gui" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/ida-gui-artifacts" \
            --log "$RUNNER_TEMP/ida-gui-smoke.log" \
            --timeout 180 \
            --qt-platform xcb \
            --require-hcli

      - name: Stop MCRIT processes
        if: ${{ always() }}
        shell: bash
        run: |
          for pid_file in "$RUNNER_TEMP/mcrit-server.pid" "$RUNNER_TEMP/mcrit-worker.pid"; do
            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

      - name: Upload integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ida-integration-logs
          path: |
            ${{ runner.temp }}/idalib-smoke.log
            ${{ runner.temp }}/ida-gui-smoke.log
            ${{ runner.temp }}/ida-gui-startup.log
            ${{ runner.temp }}/mcrit-server.log
            ${{ runner.temp }}/mcrit-worker.log
            ${{ runner.temp }}/ida-headless-help.txt
            ${{ runner.temp }}/idalib-artifacts
            ${{ runner.temp }}/ida-gui-artifacts
            ${{ runner.temp }}/idausr-idalib
            ${{ runner.temp }}/idausr-gui
          if-no-files-found: warn

  compatibility-matrix:
    name: ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_matrix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: IDA Pro 9.3 / Linux
            os: ubuntu-latest
            installer: release/9.3/ida-pro/ida-pro_93_x64linux.run
          - name: IDA Pro 9.3 / Windows
            os: windows-latest
            installer: release/9.3/ida-pro/ida-pro_93_x64win.exe
          - name: IDA Pro 9.3 / macOS ARM
            os: macos-latest
            installer: release/9.3/ida-pro/ida-pro_93_armmac.app.zip
          - name: IDA Pro 9.2 / Linux
            os: ubuntu-latest
            installer: release/9.2/ida-pro/ida-pro_92_x64linux.run
          - name: IDA Pro 9.1 / Linux
            os: ubuntu-latest
            installer: release/9.1/ida-pro/ida-pro_91_x64linux.run
          - name: IDA Pro 9.0 / Linux
            os: ubuntu-latest
            installer: release/9.0/ida-pro/ida-pro_90_x64linux.run

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install IDA ${{ matrix.name }}
        id: ida
        shell: bash
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
        run: |
          IDA_DIR="$RUNNER_TEMP/opt/ida"
          uv tool install ida-hcli
          hcli ida install -y \
            --accept-eula \
            --set-default \
            -d "${{ matrix.installer }}" \
            -l "$IDA_LICENSE_ID" \
            -i "$IDA_DIR"
          test -d "$IDA_DIR"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            IDA_BIN="$IDA_DIR/Contents/MacOS/ida"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            IDA_BIN="$(find "$IDA_DIR" -type f \( -name ida.exe -o -name ida64.exe \) -print -quit)"
          else
            IDA_BIN="$IDA_DIR/ida"
          fi
          test -n "$IDA_BIN"
          test -x "$IDA_BIN"
          echo "ida-dir=$IDA_DIR" >> "$GITHUB_OUTPUT"
          echo "ida-bin=$IDA_BIN" >> "$GITHUB_OUTPUT"
          # Propagate the accepted ida.reg (from hcli --accept-eula) into the
          # isolated IDAUSR profiles used by the offline smoke tests so IDA does
          # not refuse batch mode.
          SRC=""
          for cand in "$IDA_DIR/ida.reg" "$HOME/.idapro/ida.reg"; do
            if [[ -f "$cand" ]]; then SRC="$cand"; break; fi
          done
          if [[ -z "$SRC" ]]; then
            echo "::warning::No accepted ida.reg found to propagate into smoke profiles"
          else
            for prof in "$RUNNER_TEMP/idausr-idalib" "$RUNNER_TEMP/idausr-gui"; do
              mkdir -p "$prof"
              cp "$SRC" "$prof/ida.reg"
            done
            echo "Propagated IDA acceptance from $SRC into smoke profiles"
          fi

      - name: Keep HCLI on PATH
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify headless IDA executable
        shell: bash
        run: |
          IDA_HEADLESS=""
          for name in idat64 idat idat64.exe idat.exe; do
            candidate="$(find "${{ steps.ida.outputs.ida-dir }}" -type f -name "$name" -print -quit)"
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              IDA_HEADLESS="$candidate"
              break
            fi
          done
          if [[ -z "$IDA_HEADLESS" ]]; then
            echo "::error::Could not locate a headless IDA executable (idat64/idat) under ${{ steps.ida.outputs.ida-dir }}"
            exit 1
          fi
          echo "Found headless IDA executable: $IDA_HEADLESS"
          # Probe the binary to capture diagnostic help output. This must not fail
          # the build: a freshly installed IDA may not have its license accepted
          # yet (which the later smoke test tolerates) and some IDA versions/
          # platforms return a non-zero exit from `-h` regardless.
          "$IDA_HEADLESS" -h > "$RUNNER_TEMP/ida-headless-help.txt" 2>&1 || true

      - name: Package and lint plugin
        shell: bash
        run: |
          python -m pip install --upgrade pip ruff
          python scripts/verify_metadata_sync.py --repo .
          python scripts/verify_settings_sync.py --repo .
          python scripts/run_quality_checks.py --repo .
          python scripts/package_plugin.py --repo . --output dist/mcrit-ida.zip
          hcli plugin lint dist/mcrit-ida.zip

      - name: Build compatibility fixture
        run: |
          python scripts/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/ida-fixture.exe" \
            --variant 0

      - name: Install IDALib test runtime
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/idalib-venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/Scripts/python.exe"
          else
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/bin/python"
          fi
          echo "IDALIB_PYTHON=$IDALIB_PYTHON" >> "$GITHUB_ENV"
          "$IDALIB_PYTHON" -m pip install --upgrade pip
          "$IDALIB_PYTHON" -m pip install --upgrade \
            "${{ steps.ida.outputs.ida-dir }}/idalib/python"/idapro-*.whl \
            "smda==4.3.10" "ida-settings==3.5.1" "PySide6" "requests"

      - name: Run offline IDALib lifecycle smoke test
        shell: bash
        run: |
          "$IDALIB_PYTHON" scripts/run_idalib_smoke.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/ida-fixture.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --idausr "$RUNNER_TEMP/idausr-idalib" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/idalib-artifacts" \
            --log "$RUNNER_TEMP/idalib-smoke.log" \
            --offline \
            --require-hcli

      - name: Upload compatibility logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ida-compatibility-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/idalib-smoke.log
            ${{ runner.temp }}/ida-headless-help.txt
            ${{ runner.temp }}/idalib-artifacts
            ${{ runner.temp }}/idausr-idalib
          if-no-files-found: warn
