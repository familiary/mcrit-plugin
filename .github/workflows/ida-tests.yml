name: IDA integration

on:
  push:
    branches:
      - main
    paths:
      - "mcrit_plugin/ida/**"
      - "scripts/ida/**"
      - "tests/ida/**"
      - "CHANGELOG.md"
      - "docs/config_override.json.template"
      - ".github/workflows/ida-*.yml"
      - ".github/workflows/scripts/ida/**"
      - "mcrit_plugin/core/**"
      - "mcrit_plugin/ui_qt/**"
      - "icons/**"
      - "scripts/common/**"
      - "tests/core/**"
      - "tests/conftest.py"
      - "tests/fixtures/**"
      - "README.md"
      - "LICENSE"
      - "pyproject.toml"
      - ".gitattributes"
  pull_request:
    branches:
      - main
    paths:
      - "mcrit_plugin/ida/**"
      - "scripts/ida/**"
      - "tests/ida/**"
      - "CHANGELOG.md"
      - "docs/config_override.json.template"
      - ".github/workflows/ida-*.yml"
      - ".github/workflows/scripts/ida/**"
      - "mcrit_plugin/core/**"
      - "mcrit_plugin/ui_qt/**"
      - "icons/**"
      - "scripts/common/**"
      - "tests/core/**"
      - "tests/conftest.py"
      - "tests/fixtures/**"
      - "README.md"
      - "LICENSE"
      - "pyproject.toml"
      - ".gitattributes"
  workflow_dispatch:
    inputs:
      run_matrix:
        description: Run the broader IDA version and operating-system matrix
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ida-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  MCRIT_VERSION: "1.9.0"
  MCRIT_SERVER: "http://127.0.0.1:8000"

jobs:
  preflight:
    name: Licence preflight
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide whether the licensed job can run
        id: decide
        shell: bash
        env:
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          HAS_SECRETS: ${{ secrets.IDA_LICENSE_ID != '' && secrets.HCLI_API_KEY != '' }}
        run: |
          reason=""
          if [[ "$FORK_PR" == "true" ]]; then
            reason="the pull request comes from a fork, which does not receive the IDA licence secrets"
          elif [[ "$HAS_SECRETS" != "true" ]]; then
            reason="IDA_LICENSE_ID or HCLI_API_KEY is not set on this repository"
          fi
          if [[ -z "$reason" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::warning::Licensed IDA integration will not run: $reason"
          fi

  licensed-linux:
    name: IDA Pro 9.3 / Ubuntu / live MCRIT
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:5.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install Linux IDA runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libopengl0 libgl1 libegl1 libxkbcommon0 libdbus-1-3 fontconfig \
            libx11-6 libxcb1 libxcb-cursor0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-icccm4 libxcb-image0 libxcb-xkb1 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxcb-sync1 libfreetype6 xvfb

      - name: Install IDA Pro 9.3
        id: ida
        shell: bash
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
        run: |
          IDA_DIR="$RUNNER_TEMP/opt/ida"
          uv tool install ida-hcli
          hcli ida install -y \
            --accept-eula \
            --set-default \
            -d release/9.3/ida-pro/ida-pro_93_x64linux.run \
            -l "$IDA_LICENSE_ID" \
            -i "$IDA_DIR"
          test -d "$IDA_DIR"
          test -x "$IDA_DIR/ida"
          echo "ida-dir=$IDA_DIR" >> "$GITHUB_OUTPUT"
          echo "ida-bin=$IDA_DIR/ida" >> "$GITHUB_OUTPUT"
          # hcli --accept-eula records EULA acceptance only in the *default* IDAUSR; the isolated
          # test profiles refuse batch mode without the accepted ida.reg.
          SRC=""
          for cand in "$IDA_DIR/ida.reg" "$HOME/.idapro/ida.reg"; do
            if [[ -f "$cand" ]]; then SRC="$cand"; break; fi
          done
          if [[ -z "$SRC" ]]; then
            echo "::warning::No accepted ida.reg found to propagate into test profiles"
          else
            for prof in "$RUNNER_TEMP/idausr-idalib" "$RUNNER_TEMP/idausr-gui"; do
              mkdir -p "$prof"
              cp "$SRC" "$prof/ida.reg"
            done
            echo "Propagated IDA acceptance from $SRC into test profiles"
          fi

      - name: Keep HCLI on PATH
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify service Python
        shell: bash
        run: |
          python --version
          python - <<'PY'
          import os
          import sys

          if sys.version_info[:2] != (3, 12):
              raise SystemExit(
                  f"the MCRIT {os.environ['MCRIT_VERSION']} service venv must use Python 3.12,"
                  f" the repository floor, got {sys.version}"
              )
          PY

      - name: Verify headless IDA executable
        shell: bash
        run: |
          IDA_HEADLESS=""
          for name in idat64 idat idat64.exe idat.exe; do
            candidate="$(find "${{ steps.ida.outputs.ida-dir }}" -type f -name "$name" -print -quit)"
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              IDA_HEADLESS="$candidate"
              break
            fi
          done
          if [[ -z "$IDA_HEADLESS" ]]; then
            echo "::error::Could not locate a headless IDA executable (idat64/idat) under ${{ steps.ida.outputs.ida-dir }}"
            exit 1
          fi
          echo "Found headless IDA executable: $IDA_HEADLESS"
          # must not fail: a fresh IDA may not have its license accepted yet, and some IDA
          # versions/platforms return a non-zero exit from `-h` regardless
          "$IDA_HEADLESS" -h > "$RUNNER_TEMP/ida-headless-help.txt" 2>&1 || true

      - name: Install validation tooling
        run: python -m pip install --upgrade pip ruff

      - name: Verify metadata and package
        shell: bash
        run: |
          python scripts/ida/verify_metadata_sync.py --repo .
          python scripts/common/verify_settings_sync.py --repo .
          python scripts/common/run_quality_checks.py --repo .
          python scripts/ida/package_plugin.py --repo . --output dist/mcrit-ida.zip
          hcli plugin lint dist/mcrit-ida.zip

      - name: Build deterministic MCRIT fixtures
        run: |
          python scripts/common/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-reference.exe" \
            --variant 0
          python scripts/common/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-idalib-query.exe" \
            --variant 1
          python scripts/common/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/mcrit-gui-query.exe" \
            --variant 2

      - name: Install MCRIT service
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/mcrit-venv"
          "$RUNNER_TEMP/mcrit-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/mcrit-venv/bin/python" -m pip install "mcrit==${MCRIT_VERSION}"

      - name: Install IDALib test runtime
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/idalib-venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/Scripts/python.exe"
          else
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/bin/python"
          fi
          echo "IDALIB_PYTHON=$IDALIB_PYTHON" >> "$GITHUB_ENV"
          "$IDALIB_PYTHON" -m pip install --upgrade pip
          "$IDALIB_PYTHON" -m pip install --upgrade \
            "${{ steps.ida.outputs.ida-dir }}/idalib/python"/idapro-*.whl \
            "smda==4.8.0" "ida-settings==3.5.1" "PySide6" "requests"

      - name: Wait for MongoDB
        shell: bash
        run: |
          "$RUNNER_TEMP/mcrit-venv/bin/python" - <<'PY'
          import time
          import pymongo

          deadline = time.monotonic() + 60
          last_error = None
          while time.monotonic() < deadline:
              try:
                  client = pymongo.MongoClient(
                      "mongodb://127.0.0.1:27017/",
                      serverSelectionTimeoutMS=1000,
                  )
                  client.admin.command("ping")
                  print("MongoDB is ready.")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"MongoDB did not become ready: {last_error}")
          PY

      - name: Start MCRIT server and worker
        shell: bash
        run: |
          # setsid, not nohup alone: the runner SIGTERMs the step's process group when this step's
          # shell exits, which would kill the services before the "Wait for MCRIT API" step
          setsid nohup "$RUNNER_TEMP/mcrit-venv/bin/python" -m mcrit server \
            > "$RUNNER_TEMP/mcrit-server.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/mcrit-server.pid"
          setsid nohup "$RUNNER_TEMP/mcrit-venv/bin/python" -m mcrit worker \
            > "$RUNNER_TEMP/mcrit-worker.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/mcrit-worker.pid"
          sleep 5
          if ! kill -0 "$(cat "$RUNNER_TEMP/mcrit-server.pid")" 2>/dev/null; then
            echo "::error::MCRIT server exited during startup:"
            cat "$RUNNER_TEMP/mcrit-server.log"
            exit 1
          fi
          if ! kill -0 "$(cat "$RUNNER_TEMP/mcrit-worker.pid")" 2>/dev/null; then
            echo "::error::MCRIT worker exited during startup:"
            cat "$RUNNER_TEMP/mcrit-worker.log"
            exit 1
          fi
          echo "MCRIT server (pid $(cat "$RUNNER_TEMP/mcrit-server.pid")) and worker (pid $(cat "$RUNNER_TEMP/mcrit-worker.pid")) started."

      - name: Wait for MCRIT API
        shell: bash
        run: |
          "$RUNNER_TEMP/mcrit-venv/bin/python" - <<'PY'
          import time
          import requests

          deadline = time.monotonic() + 90
          last_error = None
          while time.monotonic() < deadline:
              try:
                  response = requests.get("http://127.0.0.1:8000/version", timeout=2)
                  if response.ok:
                      print(response.text)
                      break
              except Exception as exc:
                  last_error = exc
              time.sleep(2)
          else:
              raise SystemExit(f"MCRIT API did not become ready: {last_error}")
          PY

      - name: Seed MCRIT reference sample
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/mcrit-venv/bin/python" scripts/common/seed_mcrit.py \
            --server "$MCRIT_SERVER" \
            --sample "${{ runner.temp }}/mcrit-reference.exe" \
            --timeout 180

      - name: Record reference SHA-256
        id: reference
        shell: bash
        run: echo "sha256=$(sha256sum '${{ runner.temp }}/mcrit-reference.exe' | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run live IDALib integration test
        shell: bash
        run: |
          "$IDALIB_PYTHON" scripts/ida/run_idalib_integration.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/mcrit-idalib-query.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --reference-sha256 "${{ steps.reference.outputs.sha256 }}" \
            --idausr "$RUNNER_TEMP/idausr-idalib" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/idalib-artifacts" \
            --log "$RUNNER_TEMP/idalib-integration.log" \
            --timeout 180 \
            --require-hcli

      - name: Install plugin runtime deps for IDA's Python
        shell: bash
        run: |
          # The Linux installer has no bundled Python executable.
          python -m pip install --target "$RUNNER_TEMP/ida-py-deps" \
            "requests" "smda==4.8.0" "ida-settings==3.5.1"

      - name: Seed GUI profile from licensed IDALib profile
        shell: bash
        run: |
          SOURCE_REG="$RUNNER_TEMP/idausr-idalib/ida.reg"
          GUI_REG="$RUNNER_TEMP/idausr-gui/ida.reg"
          test -f "$SOURCE_REG"
          cp "$SOURCE_REG" "$GUI_REG"
          strings "$GUI_REG" | grep -q '^Licenses$'

      - name: Pre-accept IDAPython PyQt5 shim for GUI profile
        shell: bash
        run: |
          # IDA 9.2+ shows a modal "enable the PyQt5 shim?" dialog on the first PyQt5 import; it ignores
          # -A / batch mode and blocks startup forever. IDAPYTHON_USE_PYQT5_SHIM=0 silences it.
          mkdir -p "$RUNNER_TEMP/idausr-gui/cfg"
          cat > "$RUNNER_TEMP/idausr-gui/cfg/idapython.cfg" <<'CFG'
          #if __IDAVER__ >= 920
          IDAPYTHON_USE_PYQT5_SHIM = 0
          #endif
          CFG

      - name: Configure IDAPython for GUI integration test
        shell: bash
        env:
          IDAUSR: ${{ runner.temp }}/idausr-gui
        run: |
          IDAPYSWITCH=$(find "${{ steps.ida.outputs.ida-dir }}" -type f -name 'idapyswitch*' -perm -u+x -print -quit)
          test -n "$IDAPYSWITCH"
          # Ask Python for its own shared library rather than globbing LIBDIR. That
          # directory holds libpython3.11.so.1.0, libpython3.11.so and libpython3.so,
          # and `find -print -quit` returns whichever comes first in directory order.
          # libpython3.so is the stable-ABI forwarder and carries no version, so
          # idapyswitch rejects it with "Unsupported python version 0.0.0 ('')".
          PYTHON_LIBRARY="$(python - <<'PY'
          import sysconfig
          from pathlib import Path

          libdir = Path(sysconfig.get_config_var("LIBDIR") or "")
          # INSTSONAME is the versioned soname, LDLIBRARY the unversioned link name.
          # PY3LIBRARY (libpython3.so) is deliberately not a candidate.
          for var in ("INSTSONAME", "LDLIBRARY"):
              name = sysconfig.get_config_var(var)
              if not name or ".so" not in name:
                  continue
              candidate = libdir / name
              if candidate.is_file():
                  print(candidate)
                  break
          else:
              raise SystemExit(f"no shared libpython found in {libdir}")
          PY
          )"
          test -f "$PYTHON_LIBRARY"
          echo "Using $PYTHON_LIBRARY"
          "$IDAPYSWITCH" --force-path "$PYTHON_LIBRARY"

      - name: Run licensed IDA GUI toolbar integration test
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/ida-py-deps
          IDALOG: ${{ runner.temp }}/ida-gui-startup.log
        run: |
          # keep the keyfile outside the isolated IDAUSR: that profile is uploaded as a CI artifact
          LICENSE_FILE=$(find "${{ steps.ida.outputs.ida-dir }}" -maxdepth 1 -type f -name '*.hexlic' -print -quit)
          test -n "$LICENSE_FILE"
          export IDA_LICENSE="keyfile=${LICENSE_FILE}:setpref"
          xvfb-run -a python scripts/ida/run_gui_integration.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/mcrit-gui-query.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --reference-sha256 "${{ steps.reference.outputs.sha256 }}" \
            --idausr "$RUNNER_TEMP/idausr-gui" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/ida-gui-artifacts" \
            --log "$RUNNER_TEMP/ida-gui-integration.log" \
            --timeout 180 \
            --qt-platform xcb \
            --require-hcli

      - name: Stop MCRIT processes
        if: ${{ always() }}
        shell: bash
        run: |
          for pid_file in "$RUNNER_TEMP/mcrit-server.pid" "$RUNNER_TEMP/mcrit-worker.pid"; do
            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

      - name: Upload integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ida-integration-logs
          path: |
            ${{ runner.temp }}/idalib-integration.log
            ${{ runner.temp }}/ida-gui-integration.log
            ${{ runner.temp }}/ida-gui-startup.log
            ${{ runner.temp }}/mcrit-server.log
            ${{ runner.temp }}/mcrit-worker.log
            ${{ runner.temp }}/ida-headless-help.txt
            ${{ runner.temp }}/idalib-artifacts
            ${{ runner.temp }}/ida-gui-artifacts
            ${{ runner.temp }}/idausr-idalib
            ${{ runner.temp }}/idausr-gui
          if-no-files-found: warn

  licensed-result:
    name: Licensed IDA result
    needs: [preflight, licensed-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Reports rather than blocks: a fork pull request cannot obtain the licence secrets, so a
      # red check here would be one the contributor has no way to clear. A genuine failure of the
      # licensed job is still red on that job itself; this one exists so a *skip* cannot read as
      # a pass, which is how a broken step survived six weeks of fork pull requests.
      - name: Report whether the licensed job actually passed
        shell: bash
        env:
          RESULT: ${{ needs.licensed-linux.result }}
          REASON: ${{ needs.preflight.outputs.reason }}
        run: |
          if [[ "$RESULT" == "success" ]]; then
            exit 0
          fi
          if [[ "$RESULT" == "skipped" ]]; then
            message="The licensed IDA integration did not run: $REASON. Dispatch this workflow on a branch of this repository before merging."
          else
            message="The licensed IDA integration ended with result '$RESULT'."
          fi
          echo "::warning::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"

  compatibility-matrix:
    name: ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_matrix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: IDA Pro 9.3 / Linux
            os: ubuntu-latest
            installer: release/9.3/ida-pro/ida-pro_93_x64linux.run
          - name: IDA Pro 9.3 / Windows
            os: windows-latest
            installer: release/9.3/ida-pro/ida-pro_93_x64win.exe
          - name: IDA Pro 9.3 / macOS ARM
            os: macos-latest
            installer: release/9.3/ida-pro/ida-pro_93_armmac.app.zip
          - name: IDA Pro 9.2 / Linux
            os: ubuntu-latest
            installer: release/9.2/ida-pro/ida-pro_92_x64linux.run
          - name: IDA Pro 9.1 / Linux
            os: ubuntu-latest
            installer: release/9.1/ida-pro/ida-pro_91_x64linux.run
          - name: IDA Pro 9.0 / Linux
            os: ubuntu-latest
            installer: release/9.0/ida-pro/ida-pro_90_x64linux.run

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install IDA ${{ matrix.name }}
        id: ida
        shell: bash
        env:
          HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
          IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}
        run: |
          IDA_DIR="$RUNNER_TEMP/opt/ida"
          uv tool install ida-hcli
          hcli ida install -y \
            --accept-eula \
            --set-default \
            -d "${{ matrix.installer }}" \
            -l "$IDA_LICENSE_ID" \
            -i "$IDA_DIR"
          test -d "$IDA_DIR"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            IDA_BIN="$IDA_DIR/Contents/MacOS/ida"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            IDA_BIN="$(find "$IDA_DIR" -type f \( -name ida.exe -o -name ida64.exe \) -print -quit)"
          else
            IDA_BIN="$IDA_DIR/ida"
          fi
          test -n "$IDA_BIN"
          test -x "$IDA_BIN"
          echo "ida-dir=$IDA_DIR" >> "$GITHUB_OUTPUT"
          echo "ida-bin=$IDA_BIN" >> "$GITHUB_OUTPUT"
          SRC=""
          for cand in "$IDA_DIR/ida.reg" "$HOME/.idapro/ida.reg"; do
            if [[ -f "$cand" ]]; then SRC="$cand"; break; fi
          done
          if [[ -z "$SRC" ]]; then
            echo "::warning::No accepted ida.reg found to propagate into test profiles"
          else
            for prof in "$RUNNER_TEMP/idausr-idalib" "$RUNNER_TEMP/idausr-gui"; do
              mkdir -p "$prof"
              cp "$SRC" "$prof/ida.reg"
            done
            echo "Propagated IDA acceptance from $SRC into test profiles"
          fi

      - name: Keep HCLI on PATH
        shell: bash
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify headless IDA executable
        shell: bash
        run: |
          IDA_HEADLESS=""
          for name in idat64 idat idat64.exe idat.exe; do
            candidate="$(find "${{ steps.ida.outputs.ida-dir }}" -type f -name "$name" -print -quit)"
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              IDA_HEADLESS="$candidate"
              break
            fi
          done
          if [[ -z "$IDA_HEADLESS" ]]; then
            echo "::error::Could not locate a headless IDA executable (idat64/idat) under ${{ steps.ida.outputs.ida-dir }}"
            exit 1
          fi
          echo "Found headless IDA executable: $IDA_HEADLESS"
          "$IDA_HEADLESS" -h > "$RUNNER_TEMP/ida-headless-help.txt" 2>&1 || true

      - name: Package and lint plugin
        shell: bash
        run: |
          python -m pip install --upgrade pip ruff
          python scripts/ida/verify_metadata_sync.py --repo .
          python scripts/common/verify_settings_sync.py --repo .
          python scripts/common/run_quality_checks.py --repo .
          python scripts/ida/package_plugin.py --repo . --output dist/mcrit-ida.zip
          hcli plugin lint dist/mcrit-ida.zip

      - name: Build compatibility fixture
        run: |
          python scripts/common/build_test_fixture.py \
            --source tests/fixtures/mcrit_sample.c \
            --output "${{ runner.temp }}/ida-fixture.exe" \
            --variant 0

      - name: Install IDALib test runtime
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/idalib-venv"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/Scripts/python.exe"
          else
            IDALIB_PYTHON="$RUNNER_TEMP/idalib-venv/bin/python"
          fi
          echo "IDALIB_PYTHON=$IDALIB_PYTHON" >> "$GITHUB_ENV"
          "$IDALIB_PYTHON" -m pip install --upgrade pip
          "$IDALIB_PYTHON" -m pip install --upgrade \
            "${{ steps.ida.outputs.ida-dir }}/idalib/python"/idapro-*.whl \
            "smda==4.8.0" "ida-settings==3.5.1" "PySide6" "requests"

      - name: Run offline IDALib lifecycle integration test
        shell: bash
        run: |
          "$IDALIB_PYTHON" scripts/ida/run_idalib_integration.py \
            --ida-dir "${{ steps.ida.outputs.ida-dir }}" \
            --input "${{ runner.temp }}/ida-fixture.exe" \
            --mcrit-server "$MCRIT_SERVER" \
            --idausr "$RUNNER_TEMP/idausr-idalib" \
            --plugin-zip dist/mcrit-ida.zip \
            --artifacts "$RUNNER_TEMP/idalib-artifacts" \
            --log "$RUNNER_TEMP/idalib-integration.log" \
            --offline \
            --require-hcli

      - name: Upload compatibility logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ida-compatibility-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/idalib-integration.log
            ${{ runner.temp }}/ida-headless-help.txt
            ${{ runner.temp }}/idalib-artifacts
            ${{ runner.temp }}/idausr-idalib
          if-no-files-found: warn
